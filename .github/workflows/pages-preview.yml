name: Deploy public preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octopus-landing
    env:
      VITE_TELEGRAM_BOT_URL: https://web.ct-bratan.by/api/marketing/click?funnel=learning_path
      VITE_PUBLIC_PREVIEW: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: octopus-landing/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pip install Pillow
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build:pages-preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: octopus-landing/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
